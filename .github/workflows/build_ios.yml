name: Build iOS App (Cloud macOS)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: 🩵 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔧 Disable Swift Package Manager (Use CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: ⚡ Precache iOS Toolchain
        run: flutter precache --ios

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🍏 Generate iOS Platform Files
        run: |
          flutter create --platforms=ios .
          cd ios && pod install && cd ..

      - name: 🧪 Run Unit Tests
        run: flutter test

      - name: 🏗️ Build iOS Runner (No Code Signing)
        run: flutter build ios --release --no-codesign

      - name: 📦 Compress iOS Runner Output
        run: |
          cd build/ios/iphoneos
          zip -r ../../../finote_ios_release.zip Runner.app

      - name: 📤 Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finote-ios-release
          path: finote_ios_release.zip
