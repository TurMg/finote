name: Build iOS App (Cloud macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🩵 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🧪 Run Unit Tests
        run: flutter test

      - name: 🍏 Build iOS Application Framework (No Code Signing)
        run: flutter build ios --release --no-codesign

      - name: 📦 Compress iOS Runner Output
        run: |
          cd build/ios/iphoneos
          zip -r ../../../finote_ios_release.zip Runner.app

      - name: 📤 Upload iOS Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: finote-ios-release
          path: finote_ios_release.zip
